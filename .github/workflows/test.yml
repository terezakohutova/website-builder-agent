name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # GitHub sets CI=true: the browser tests then fail instead of skipping when Chrome is missing
      CHROME_ARGS: --no-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check every script
        run: |
          for f in .claude/skills/website-build/scripts/qa/*.mjs .claude/skills/website-build/scripts/qa/*.js examples/*.mjs examples/build-chain/assets/*.js tests/*.mjs; do
            node --check "$f"
          done
          python -m py_compile .claude/skills/website-build/scripts/backup/snapshot.py examples/build-chain/*.py tests/*.py

      - name: Every relative link in the docs resolves
        run: python tests/check_links.py

      - name: Python tests (snapshot.py, reference build chain)
        run: python -m unittest discover -s tests -v

      - name: axe-core for the axe.mjs tests
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
          echo "AXE_PATH=$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: QA harness tests (no browser + headless Chrome, one Chrome at a time)
        run: node --test --test-concurrency=1 "tests/*.test.mjs"

      - name: Reference build chain, then the QA harness on its output
        run: |
          python examples/build-chain/build.py
          node .claude/skills/website-build/scripts/qa/jscheck.mjs examples/sample-site/_dist
          node .claude/skills/website-build/scripts/qa/audit.mjs examples/sample-site/_dist
