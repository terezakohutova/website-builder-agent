name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check every script
        run: |
          for f in .claude/skills/website-build/scripts/qa/*.mjs .claude/skills/website-build/scripts/qa/*.js examples/*.mjs tests/*.mjs; do
            node --check "$f"
          done
          python -m py_compile .claude/skills/website-build/scripts/backup/snapshot.py tests/*.py

      - name: Every relative link in the docs resolves
        run: python tests/check_links.py

      - name: snapshot.py self-test
        run: python -m unittest discover -s tests -v

      - name: QA harness tests (argument handling + headless Chrome)
        env:
          CHROME_ARGS: --no-sandbox
        run: node --test "tests/*.test.mjs"
